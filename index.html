  <script>
    // Сразу ведём на страницу на языке телефона; если язык не наш — показываем выбор.
    (function () {
      var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']);
      for (var i = 0; i < langs.length; i++) {
        var l = String(langs[i]).toLowerCase();
        if (l.indexOf('ro') === 0 || l.indexOf('mo') === 0) { location.replace('ro/' + location.hash); return; }
        if (l.indexOf('ru') === 0) { location.replace('ru/' + location.hash); return; }
      }
    })();
  </script>
